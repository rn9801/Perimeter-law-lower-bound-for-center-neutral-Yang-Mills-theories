name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: auto
          lake-package-directory: lean

      - name: Verify current Strong-Coupling main
        run: |
          lake update strong-coupling-lattice-yang-mills
          lake build GluelumpPerimeterLaw
          lake build GluelumpPerimeterLawTests

      - name: Record full module and axiom verification
        env:
          LEAN_NUM_THREADS: "2"
        run: python3 scripts/verify.py --output "$RUNNER_TEMP/gluelump-verification"

      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-and-axiom-audit
          path: ${{ runner.temp }}/gluelump-verification
          if-no-files-found: warn

      - name: Check repository boundary
        run: |
          test "$(find GluelumpPerimeterLaw/Upstream -name '*.lean' | wc -l | tr -d ' ')" = 30
          test "$(find GluelumpPerimeterLawTests -name '*.lean' | wc -l | tr -d ' ')" = 10
          test "$(grep -c '^\[\[require\]\]$' lakefile.toml)" = 1
          grep --quiet '^rev = "main"$' lakefile.toml
          if grep --recursive --extended-regexp --line-number \
              '^import YangMills\.Gluelump' \
              GluelumpPerimeterLaw.lean GluelumpPerimeterLaw \
              GluelumpPerimeterLawTests.lean GluelumpPerimeterLawTests; then
            exit 1
          fi
          if grep --recursive --extended-regexp --line-number \
              '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' \
              GluelumpPerimeterLaw.lean GluelumpPerimeterLaw \
              GluelumpPerimeterLawTests.lean GluelumpPerimeterLawTests; then
            exit 1
          fi
          if grep --recursive --extended-regexp --line-number \
              '^[[:space:]]*(axiom|unsafe)[[:space:]]' \
              GluelumpPerimeterLaw.lean GluelumpPerimeterLaw \
              GluelumpPerimeterLawTests.lean GluelumpPerimeterLawTests; then
            exit 1
          fi
